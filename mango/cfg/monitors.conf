# | Outputs Configuration |
# https://mangowm.github.io/docs/configuration/monitors

# Portrait display on the left. Keep all origins non-negative: XWayland
# mis-warps the cursor when any output is at a negative x/y.
monitor_rule=name:^DP-2$,width:2560,height:1440,refresh:239.992,x:0,y:0,scale:1,rr:3,vrr:0

# Primary gaming display, vertically centered beside DP-2.
monitor_rule=name:^DP-1$,width:2560,height:1440,refresh:280.001,x:1440,y:560,scale:1,rr:0,vrr:1
