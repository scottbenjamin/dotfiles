# | Input Devices |
# Configure your input devices here. | https://mangowm.github.io/docs/configuration/input

xkb_rules_layout = us
repeat_rate = 65
repeat_delay = 300

# If you want to disable pointer acceleration, uncomment the lines below.
# accel_profile = 1
# accel_speed = 0.2

# Steam Controller (Gordon/Puck) exposes lizard-mode keyboard+mouse HID
# interfaces alongside Steam Input's virtual Xbox pad. Ignore the raw HID
# seats so bumper/trackpad noise cannot drive mango's scroller while a game
# is using the pad. Steam Input to games is unaffected (uinput xpad).
# https://mangowm.github.io/docs/configuration/input/
device_rule = name:Valve Software Steam Controller Puck Keyboard, send_events_mode:1
device_rule = name:Valve Software Steam Controller Puck Mouse, send_events_mode:1
