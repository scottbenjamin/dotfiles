# | Rules |
# Window/Tag/Layer rules. | https://mangowm.github.io/docs/window-management/rules

# Anchor Steam client matches. Unanchored [Ss]team also matches steam_app_* and
# forces games floating + exclusive fullscreen, which Proton marks input-deaf.
windowrule = isfloating:1, appid:^[Ss]team$
# Steam's X11 size hints keep the client ~half-width when it is the only
# tiled window. Ignore hints and report tiled edges so scroller overspread
# can give it the full output. https://mangowm.github.io/docs/window-management/rules/
windowrule = isfloating:0, isnosizehint:1, force_tiled_state:1, scroller_proportion_single:1.0, appid:^[Ss]team$, title:^Steam$
windowrule = isfloating:1, appid:^[Ss]team$, title:Steam Settings

# Route Steam games to the dedicated monocle tag on the primary display.
# force_render keeps the buffer alive when the tag is hidden so X11/Proton
# games do not re-query the portrait output (1440x2560) and draw half-width.
# Non-Steam launcher exceptions: 2330980018 (EQ Legends), 2330876090 (Monsters
# and Memories) — float on tag 4 instead of exclusive fullscreen.
windowrule = tags:4, monitor:DP-1, isfloating:0, isfullscreen:1, isnoborder:1, force_render:1, ignore_minimize:1, appid:^steam_app_(?!2330980018$|2330876090$)[0-9]+$, title:^(?!EQEmu Patcher$).*$
windowrule = tags:4, monitor:DP-1, isfloating:0, appid:^(gamescope|com\.valvesoftware\.gamescope)$

# Some native Steam games do not expose their Steam app ID to Wayland.
windowrule = tags:4, monitor:DP-1, appid:^broken$, title:^Songs of Syx$

windowrule = isfloating:1, appid:^steam_app_2330980018$
windowrule = tags:4, monitor:DP-1, isfloating:1, isfullscreen:0, force_render:1, appid:^steam_app_2330876090$
windowrule = isfloating:1, appid:^steam_app_[0-9]+$, title:^EQEmu Patcher$

windowrule = isfloating:1, appid:^org\.gnome\.Calculator$

windowrule = isfloating:1, appid:^1password$

# Keep glyphs sharp. Electron/Chromium CSD often has an alpha channel, and
# mango's window blur then filters the whole buffer (same idea as Hyprland
# no-blur-browsers). Ghostty is already opaque; skip blur there too.
windowrule = noblur:1, appid:^(slack|brave-browser|cursor|com\.mitchellh\.ghostty)$

layerrule = noanim:1, noblur:1, layer_name:selection
