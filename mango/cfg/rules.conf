# | Rules |
# Window/Tag/Layer rules. | https://mangowm.github.io/docs/window-management/rules

# Anchor Steam client matches. Unanchored [Ss]team also matches steam_app_* and
# forces games floating + exclusive fullscreen, which Proton marks input-deaf.
window_rule = is_floating:1, app_id:^[Ss]team$
# Steam's X11 size hints keep the client ~half-width when it is the only
# tiled window. Ignore hints and report tiled edges so scroller overspread
# can give it the full output. https://mangowm.github.io/docs/window-management/rules/
window_rule = is_floating:0, no_size_hint:1, force_tiled_state:1, scroller_proportion_single:1.0, app_id:^[Ss]team$, title:^Steam$
window_rule = is_floating:1, app_id:^[Ss]team$, title:Steam Settings

# Route Steam games to the dedicated monocle tag on the primary display.
# force_render keeps the buffer alive when the tag is hidden so X11/Proton
# games do not re-query the portrait output (1440x2560) and draw half-width.
# Fake fullscreen (not is_fullscreen) — exclusive scanout works since 0.17.4
# and freezes Proton/XWayland games when focus leaves the window.
# Do not set confine_pointer — borderless/fullscreen games need the cursor
# free to reach the other monitor.
# Non-Steam launcher exceptions: 2330980018 (EQ Legends) floats;
# MnM (3060771040 current shortcut; 2330876090 older) same fake fullscreen.
# Battle.net/WoW: prefer gamescope launch (battlenet-gamescope.sh).
window_rule = tags:4, monitor:DP-1, is_floating:0, is_fake_fullscreen:1, no_border:1, force_render:1, ignore_minimize:1, app_id:^steam_app_(?!2330980018$|2330876090$|3060771040$)[0-9]+$, title:^(?!EQEmu Patcher$).*$
window_rule = tags:4, monitor:DP-1, is_floating:0, is_fake_fullscreen:1, no_border:1, force_render:1, ignore_minimize:1, app_id:^(gamescope|com\.valvesoftware\.gamescope)$
# Gamescope's Wayland toplevel shows up as app_id "broken", title "Battle.net".
# Float that. A tiled single window on tag 4 otherwise fills DP-1.
window_rule = tags:4, monitor:DP-1, is_floating:1, is_fake_fullscreen:0, is_fullscreen:0, width:1280, height:720, no_size_hint:1, app_id:^(gamescope|com\.valvesoftware\.gamescope|broken)$, title:^Battle\.net$

# Some native Steam games do not expose their Steam app ID to Wayland.
window_rule = tags:4, monitor:DP-1, app_id:^broken$, title:^Songs of Syx$

window_rule = is_floating:1, app_id:^steam_app_2330980018$
# Battle.net launcher floats. Super+Shift+f fullscreens it for WoW.
window_rule = tags:4, monitor:DP-1, is_floating:1, is_fake_fullscreen:0, is_fullscreen:0, width:1280, height:800, force_render:1, ignore_minimize:1, app_id:^steam_app_2266993580$
window_rule = tags:4, monitor:DP-1, is_floating:0, is_fake_fullscreen:1, no_border:1, force_render:1, ignore_minimize:1, app_id:^steam_app_(2330876090|3060771040)$
window_rule = is_floating:1, app_id:^steam_app_[0-9]+$, title:^EQEmu Patcher$

window_rule = is_floating:1, app_id:^org\.gnome\.Calculator$

# Flatpak/desktop id is com.onepassword.OnePassword; older builds used 1password.
window_rule = is_floating:1, app_id:^(1password|com\.onepassword\.OnePassword)$

# Keep glyphs sharp. Electron/Chromium CSD often has an alpha channel, and
# mango's window blur then filters the whole buffer (same idea as Hyprland
# no-blur-browsers). Ghostty is already opaque; skip blur there too.
window_rule = no_blur:1, app_id:^(slack|brave-browser|cursor|com\.mitchellh\.ghostty)$

layer_rule = no_animation:1, no_blur:1, layer_name:selection
