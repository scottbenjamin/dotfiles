id = "absci.gitlab-review"
name = "GitLab MR Review"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Highlight GitLab MRs awaiting your review and spawn a claude agent on the MR diff in a herdr worktree."
platforms = ["linux", "macos"]

[[actions]]
id = "list"
title = "GitLab: MRs awaiting my review"
contexts = ["workspace"]
command = ["bash", "gitlab-review.sh", "list"]

[[actions]]
id = "review"
title = "GitLab: review MR (worktree + claude)"
contexts = ["workspace"]
command = ["bash", "gitlab-review.sh", "review"]

[[actions]]
id = "diff"
title = "GitLab: open MR diff"
contexts = ["workspace"]
command = ["bash", "gitlab-review.sh", "diff"]

[[panes]]
id = "picker"
title = "MRs awaiting review"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/gitlab-review.sh\" picker"]

[[link_handlers]]
id = "mr"
title = "Review GitLab MR"
pattern = "/-/merge_requests/[0-9]+"
action = "review"
